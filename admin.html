<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - 论文收集系统</title>
<link rel="stylesheet" href="css/common.css">
<style>
body { background: #f3f4f6; }
.layout { display: flex; min-height: 100vh; }
.sidebar { width: 220px; background: #1e3a8a; color: #fff; padding: 20px 0; flex-shrink: 0; }
.logo { padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 16px; }
.logo h2 { font-size: 18px; }
.logo p { font-size: 12px; color: #93c5fd; margin-top: 4px; }
.nav-item { display: block; padding: 12px 20px; color: #dbeafe; text-decoration: none; cursor: pointer; border-left: 3px solid transparent; transition: all 0.15s; font-size: 14px; }
.nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.nav-item.active { background: rgba(255,255,255,0.1); border-left-color: #fff; color: #fff; font-weight: 500; }
.nav-item .icon { margin-right: 8px; }
.main { flex: 1; padding: 24px; overflow-x: auto; }
.header-bar { background: #fff; padding: 16px 24px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
.header-bar h1 { font-size: 20px; }
.header-bar .actions { display: flex; gap: 8px; }
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
@media (max-width: 900px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
.stat-card { background: #fff; padding: 20px; border-radius: 12px; border-left: 4px solid #2563eb; }
.stat-card .value { font-size: 32px; font-weight: 700; color: #1e3a8a; }
.stat-card .label { font-size: 13px; color: #6b7280; margin-top: 4px; }
.stat-card.green { border-left-color: #10b981; } .stat-card.green .value { color: #065f46; }
.stat-card.orange { border-left-color: #f59e0b; } .stat-card.orange .value { color: #92400e; }
.stat-card.purple { border-left-color: #8b5cf6; } .stat-card.purple .value { color: #5b21b6; }
.charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
@media (max-width: 900px) { .charts-row { grid-template-columns: 1fr; } }
.chart-card { background: #fff; padding: 20px; border-radius: 12px; }
.chart-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
.bar-row { display: flex; align-items: center; margin: 6px 0; font-size: 13px; }
.bar-label { width: 100px; color: #6b7280; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { flex: 1; background: #f3f4f6; height: 18px; border-radius: 4px; overflow: hidden; margin: 0 8px; }
.bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #1d4ed8); border-radius: 4px; }
.bar-value { width: 40px; text-align: right; font-weight: 600; }
.filter-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.filter-bar .input, .filter-bar .select { width: auto; min-width: 140px; }
.table-card { background: #fff; border-radius: 12px; overflow: hidden; }
.table-header { padding: 16px 20px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
.table-header h3 { font-size: 15px; }
.papers-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.papers-table th { background: #f9fafb; padding: 12px; text-align: left; font-weight: 600; color: #374151; border-bottom: 1px solid #e5e7eb; white-space: nowrap; }
.papers-table td { padding: 12px; border-bottom: 1px solid #f3f4f6; }
.papers-table tr:hover { background: #f9fafb; }
.papers-table .title-cell { max-width: 280px; }
.papers-table .title-cell strong { color: #1f2937; }
.papers-table .actions { display: flex; gap: 4px; flex-wrap: wrap; }
.empty-state { text-align: center; padding: 60px 20px; color: #9ca3af; }
.empty-state .icon { font-size: 56px; margin-bottom: 12px; }
.modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
.modal { background: #fff; border-radius: 12px; max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; }
.modal-header { padding: 20px 24px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
.modal-header h3 { font-size: 18px; }
.modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: #6b7280; }
.modal-body { padding: 24px; }
.modal-body .row { display: flex; margin: 8px 0; font-size: 14px; }
.modal-body .row .label { width: 90px; color: #6b7280; flex-shrink: 0; }
.modal-body .row .value { flex: 1; }
.modal-footer { padding: 16px 24px; border-top: 1px solid #e5e7eb; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.login-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
.login-card { background: #fff; padding: 40px; border-radius: 16px; width: 100%; max-width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
.login-card h1 { text-align: center; font-size: 22px; color: #1e3a8a; margin-bottom: 8px; }
.login-card .hint { text-align: center; color: #6b7280; font-size: 13px; margin-bottom: 24px; }
</style>
</head>
<body>

<!-- 登录页 -->
<div id="loginPage" class="login-page">
  <div class="login-card">
    <h1>🔐 管理后台</h1>
    <p class="hint">请输入管理员密码</p>
    <div class="form-group">
      <input type="password" class="input" id="passwordInput"
             placeholder="管理员密码" onkeydown="if(event.key==='Enter')handleLogin()">
    </div>
    <button class="btn btn-primary btn-lg" style="width:100%" onclick="handleLogin()">登录</button>
  </div>
</div>

<!-- 后台主页面 -->
<div id="mainPage" style="display:none">
  <div class="layout">
    <div class="sidebar">
      <div class="logo">
        <h2>📚 论文管理</h2>
        <p>云端版</p>
      </div>
      <div class="nav-item active" data-tab="dashboard" onclick="switchTab('dashboard')">
        <span class="icon">📊</span>数据看板
      </div>
      <div class="nav-item" data-tab="papers" onclick="switchTab('papers')">
        <span class="icon">📄</span>论文列表
      </div>
      <div class="nav-item" data-tab="authors" onclick="switchTab('authors')">
        <span class="icon">👥</span>按作者统计
      </div>
      <div class="nav-item" data-tab="settings" onclick="switchTab('settings')">
        <span class="icon">⚙️</span>系统设置
      </div>
      <div class="nav-item" onclick="location.href='/'">
        <span class="icon">🏠</span>返回首页
      </div>
    </div>

    <div class="main">
      <!-- 看板 -->
      <div id="tab-dashboard">
        <div class="header-bar">
          <h1>📊 数据看板</h1>
          <div class="actions">
            <button class="btn btn-outline btn-sm" onclick="loadAll()">🔄 刷新</button>
          </div>
        </div>
        <div class="stat-grid" id="statGrid"></div>
        <div class="charts-row">
          <div class="chart-card">
            <div class="chart-title">各学院提交数</div>
            <div id="deptChart"></div>
          </div>
          <div class="chart-card">
            <div class="chart-title">审核状态分布</div>
            <div id="statusChart"></div>
          </div>
        </div>
        <div class="chart-card">
          <div class="chart-title">最近 7 天提交趋势</div>
          <div id="trendChart" style="display:flex;align-items:flex-end;height:160px;gap:8px;padding:8px 0"></div>
        </div>
      </div>

      <!-- 论文列表 -->
      <div id="tab-papers" style="display:none">
        <div class="header-bar">
          <h1>📄 论文列表</h1>
          <div class="actions">
            <button class="btn btn-success btn-sm" onclick="exportExcel()">📥 导出 Excel</button>
          </div>
        </div>
        <div class="filter-bar">
          <input type="text" class="input" id="searchInput" placeholder="搜索标题/作者/提交人"
                 style="flex:1" oninput="renderPapers()">
          <select class="select" id="filterDept" onchange="renderPapers()">
            <option value="">全部学院</option>
          </select>
          <select class="select" id="filterStatus" onchange="renderPapers()">
            <option value="">全部状态</option>
            <option value="pending">待审核</option>
            <option value="approved">已通过</option>
            <option value="excellent">优秀</option>
            <option value="rejected">已退回</option>
          </select>
        </div>
        <div class="table-card">
          <div id="papersListContent"></div>
        </div>
      </div>

      <!-- 作者统计 -->
      <div id="tab-authors" style="display:none">
        <div class="header-bar">
          <h1>👥 按作者统计</h1>
        </div>
        <div class="card">
          <div id="authorStats"></div>
        </div>
      </div>

      <!-- 系统设置 -->
      <div id="tab-settings" style="display:none">
        <div class="header-bar">
          <h1>⚙️ 系统设置</h1>
        </div>
        <div class="card">
          <h3 class="mb-3">🔑 修改密码</h3>
          <p class="text-muted mb-3">修改管理员登录密码，修改后需重新登录。</p>
          <div class="form-group">
            <label class="form-label">当前密码</label>
            <input type="password" class="input" id="oldPwd" placeholder="输入当前密码">
          </div>
          <div class="form-group">
            <label class="form-label">新密码</label>
            <input type="password" class="input" id="newPwd" placeholder="输入新密码（至少4位）">
          </div>
          <div class="form-group">
            <label class="form-label">确认新密码</label>
            <input type="password" class="input" id="newPwd2" placeholder="再次输入新密码">
          </div>
          <button class="btn btn-primary" onclick="changePassword()">确认修改</button>
        </div>
        <div class="card">
          <h3 class="mb-3">🔧 系统信息</h3>
          <div id="systemInfo"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 详情弹窗 -->
<div id="detailModal" class="modal-mask" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">论文详情</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
let allPapers = [];
let currentStats = null;

const STATUS_MAP = {
  pending: ['待审核', 'badge-pending'],
  approved: ['已通过', 'badge-approved'],
  rejected: ['已退回', 'badge-rejected'],
  excellent: ['优秀', 'badge-excellent']
};

// 登录
async function handleLogin() {
  const pwd = document.getElementById('passwordInput').value;
  if (!pwd) return showToast('请输入密码', 'error');
  try {
    const result = await API.post('/api/login', { password: pwd });
    if (!result.success) {
      showToast('密码错误', 'error');
      return;
    }
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('mainPage').style.display = 'block';
    loadAll();
  } catch (e) {
    showToast('登录失败：' + e.message, 'error');
  }
}

async function loadAll() {
  try {
    allPapers = await API.get('/api/papers');
    allPapers.sort((a, b) => b.submitTime - a.submitTime);
    currentStats = await API.get('/api/stats');
    renderDashboard();
    renderPapers();
    renderAuthorStats();
    updateDeptFilter();
  } catch (e) {
    showToast('加载数据失败：' + e.message, 'error');
  }
}

function switchTab(tab) {
  document.querySelectorAll('[id^="tab-"]').forEach(el => el.style.display = 'none');
  document.getElementById('tab-' + tab).style.display = 'block';
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
}

function renderDashboard() {
  const s = currentStats;
  document.getElementById('statGrid').innerHTML = `
    <div class="stat-card"><div class="value">${s.total}</div><div class="label">累计提交</div></div>
    <div class="stat-card green"><div class="value">${s.todayCount}</div><div class="label">今日新增</div></div>
    <div class="stat-card orange"><div class="value">${s.weekCount}</div><div class="label">本周新增</div></div>
    <div class="stat-card purple"><div class="value">${Object.keys(s.byDepartment).length}</div><div class="label">参与学院</div></div>
  `;

  // 学院柱状图
  const depts = Object.entries(s.byDepartment).sort((a, b) => b[1] - a[1]);
  const maxDept = Math.max(1, ...depts.map(d => d[1]));
  document.getElementById('deptChart').innerHTML = depts.length === 0
    ? '<div class="text-muted text-center" style="padding:20px">暂无数据</div>'
    : depts.map(([name, count]) => `
        <div class="bar-row">
          <div class="bar-label" title="${escapeHTML(name)}">${escapeHTML(name)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${count / maxDept * 100}%"></div></div>
          <div class="bar-value">${count}</div>
        </div>
      `).join('');

  // 状态柱状图
  const statuses = [
    ['待审核', s.byStatus.pending || 0, '#f59e0b'],
    ['已通过', s.byStatus.approved || 0, '#10b981'],
    ['优秀', s.byStatus.excellent || 0, '#3b82f6'],
    ['已退回', s.byStatus.rejected || 0, '#ef4444']
  ];
  const maxStatus = Math.max(1, ...statuses.map(x => x[1]));
  document.getElementById('statusChart').innerHTML = statuses.map(([name, count, color]) => `
    <div class="bar-row">
      <div class="bar-label">${name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${count / maxStatus * 100}%;background:${color}"></div></div>
      <div class="bar-value">${count}</div>
    </div>
  `).join('');

  // 7 天趋势
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0, 10);
    days.push({ key, label: `${d.getMonth() + 1}/${d.getDate()}`, count: s.byDay[key] || 0 });
  }
  const maxDay = Math.max(1, ...days.map(d => d.count));
  document.getElementById('trendChart').innerHTML = days.map(d => `
    <div style="flex:1;text-align:center">
      <div style="height:${Math.max(8, d.count / maxDay * 130)}px;
                  background:linear-gradient(180deg,#3b82f6,#1d4ed8);
                  border-radius:4px 4px 0 0;margin:0 4px;position:relative">
        <div style="position:absolute;top:-22px;left:50%;transform:translateX(-50%);
                    font-size:11px;font-weight:600;color:#1e3a8a">${d.count}</div>
      </div>
      <div style="font-size:11px;color:#6b7280;margin-top:6px">${d.label}</div>
    </div>
  `).join('');
}

function updateDeptFilter() {
  const depts = [...new Set(allPapers.map(p => p.department).filter(Boolean))].sort();
  const sel = document.getElementById('filterDept');
  sel.innerHTML = '<option value="">全部学院</option>' +
    depts.map(d => `<option>${escapeHTML(d)}</option>`).join('');
}

function renderPapers() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const dept = document.getElementById('filterDept').value;
  const status = document.getElementById('filterStatus').value;

  let filtered = allPapers.filter(p => {
    if (search) {
      const hay = `${p.title} ${p.submitter} ${(p.authors || []).join(' ')}`.toLowerCase();
      if (!hay.includes(search)) return false;
    }
    if (dept && p.department !== dept) return false;
    if (status && (p.status || 'pending') !== status) return false;
    return true;
  });

  const container = document.getElementById('papersListContent');
  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><div>暂无符合条件的论文</div></div>';
    return;
  }

  container.innerHTML = `
    <table class="papers-table">
      <thead>
        <tr><th>论文标题</th><th>提交人</th><th>学院</th><th>状态</th><th>提交时间</th><th>操作</th></tr>
      </thead>
      <tbody>
        ${filtered.map(p => {
          const [s, cls] = STATUS_MAP[p.status || 'pending'];
          const hasFiles = p.files && p.files.length;
          return `
            <tr>
              <td class="title-cell"><strong>${escapeHTML(p.title)}</strong></td>
              <td>${escapeHTML(p.submitter)}</td>
              <td>${escapeHTML(p.department)}</td>
              <td><span class="badge ${cls}">${s}</span></td>
              <td>${formatTime(p.submitTime)}</td>
              <td class="actions">
                <button class="btn btn-outline btn-sm" onclick="showDetail('${p.id}')">查看</button>
                ${hasFiles ? `<button class="btn btn-primary btn-sm" onclick="downloadFiles('${p.id}')">下载</button>` : ''}
                <button class="btn btn-danger btn-sm" onclick="deletePaper('${p.id}')">删除</button>
              </td>
            </tr>
          `;
        }).join('')}
      </tbody>
    </table>
    <div style="padding:12px 16px;font-size:13px;color:#6b7280">共 ${filtered.length} 条记录</div>
  `;
}

function showDetail(id) {
  const p = allPapers.find(x => x.id === id);
  if (!p) return;
  const [s, cls] = STATUS_MAP[p.status || 'pending'];
  document.getElementById('modalTitle').textContent = p.title;
  document.getElementById('modalBody').innerHTML = `
    <div class="row"><div class="label">提交人</div><div class="value">${escapeHTML(p.submitter)}</div></div>
    <div class="row"><div class="label">学院</div><div class="value">${escapeHTML(p.department)}</div></div>
    ${p.phone ? `<div class="row"><div class="label">电话</div><div class="value">${escapeHTML(p.phone)}</div></div>` : ''}
    <div class="row"><div class="label">作者</div><div class="value">${(p.authors || []).map(escapeHTML).join('、') || '-'}</div></div>
    <div class="row"><div class="label">状态</div><div class="value"><span class="badge ${cls}">${s}</span></div></div>
    <div class="row"><div class="label">提交时间</div><div class="value">${formatTime(p.submitTime)}</div></div>
    ${p.note ? `<div class="row"><div class="label">备注</div><div class="value">${escapeHTML(p.note)}</div></div>` : ''}
    ${(p.files && p.files.length) ? `
      <div class="row">
        <div class="label">附件(${p.files.length}个)</div>
        <div class="value">
          ${p.files.map((f, i) => `
            <div style="margin-bottom:4px">
              📄 ${escapeHTML(f.fileName)} <span class="text-muted">(${formatSize(f.fileSize)})</span>
            </div>`).join('')}
        </div>
      </div>
    ` : ''}
  `;
  document.getElementById('modalFooter').innerHTML = `
    ${(p.files && p.files.length) ? `<button class="btn btn-primary" onclick="downloadFiles('${p.id}')">📥 下载全部(${p.files.length})</button>` : ''}
    <button class="btn btn-success" onclick="setStatus('${p.id}', 'approved')">✓ 通过</button>
    <button class="btn btn-primary" style="background:#8b5cf6" onclick="setStatus('${p.id}', 'excellent')">⭐ 优秀</button>
    <button class="btn btn-secondary" onclick="setStatus('${p.id}', 'pending')">↩ 待审核</button>
    <button class="btn btn-danger" onclick="setStatus('${p.id}', 'rejected')">✗ 退回</button>
  `;
  document.getElementById('detailModal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('detailModal').style.display = 'none';
}

async function setStatus(id, status) {
  try {
    await API.put('/api/papers/' + id, { status });
    showToast('状态已更新', 'success');
    closeModal();
    loadAll();
  } catch (e) {
    showToast('操作失败：' + e.message, 'error');
  }
}

async function deletePaper(id) {
  if (!confirm('确定删除这篇论文？无法恢复！')) return;
  try {
    await API.del('/api/papers/' + id);
    showToast('已删除', 'success');
    loadAll();
  } catch (e) {
    showToast('删除失败：' + e.message, 'error');
  }
}

// 下载论文附件
function downloadFiles(id) {
  const p = allPapers.find(x => x.id === id);
  if (!p || !p.files || !p.files.length) return showToast('该论文没有附件', 'warning');
  for (let i = 0; i < p.files.length; i++) {
    // 直接打开下载链接
    const a = document.createElement('a');
    a.href = `/api/papers/${id}/file/${i}`;
    a.download = '';
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
}

function exportExcel() {
  if (!allPapers.length) return showToast('暂无数据', 'warning');
  const data = allPapers.map((p, i) => ({
    '序号': i + 1,
    '论文标题': p.title,
    '提交人': p.submitter,
    '学院': p.department,
    '联系电话': p.phone || '',
    '作者': (p.authors || []).join('、'),
    '备注': p.note || '',
    '文件名': (p.files && p.files.length) ? p.files.map(f => f.fileName).join('；') : '',
    '文件大小': formatSize((p.files && p.files.length) ? p.files.reduce((s, f) => s + (f.fileSize || 0), 0) : 0),
    '提交时间': formatTime(p.submitTime),
    '审核状态': STATUS_MAP[p.status || 'pending'][0],
    '审核意见': p.remark || ''
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '论文汇总');
  const filename = `论文汇总_${new Date().toISOString().slice(0, 10)}.xlsx`;
  XLSX.writeFile(wb, filename);
  showToast('Excel 已导出', 'success');
}

function renderAuthorStats() {
  const authorMap = {};
  for (const p of allPapers) {
    const authors = p.authors || [p.submitter];
    authors.forEach(a => {
      if (!a) return;
      if (!authorMap[a]) authorMap[a] = { count: 0, papers: [] };
      authorMap[a].count++;
      authorMap[a].papers.push(p.title);
    });
  }
  const sorted = Object.entries(authorMap).sort((a, b) => b[1].count - a[1].count);
  document.getElementById('authorStats').innerHTML = sorted.length === 0
    ? '<div class="text-muted text-center">暂无数据</div>'
    : `
      <table class="papers-table">
        <thead><tr><th>作者</th><th>论文数</th><th>论文列表</th></tr></thead>
        <tbody>
          ${sorted.map(([name, info]) => `
            <tr>
              <td><strong>${escapeHTML(name)}</strong></td>
              <td>${info.count}</td>
              <td style="font-size:12px;color:#6b7280">${info.papers.map(escapeHTML).join('；')}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
}

async function changePassword() {
  const oldPwd = document.getElementById('oldPwd').value;
  const newPwd = document.getElementById('newPwd').value;
  const newPwd2 = document.getElementById('newPwd2').value;
  if (!oldPwd || !newPwd || !newPwd2) return showToast('请填写完整', 'error');
  if (newPwd.length < 4) return showToast('新密码至少4位', 'error');
  if (newPwd !== newPwd2) return showToast('两次输入的新密码不一致', 'error');
  try {
    const result = await API.put('/api/password', { oldPassword: oldPwd, newPassword: newPwd });
    if (result.success) {
      showToast('密码修改成功，请重新登录', 'success');
      document.getElementById('oldPwd').value = '';
      document.getElementById('newPwd').value = '';
      document.getElementById('newPwd2').value = '';
      setTimeout(() => {
        document.getElementById('mainPage').style.display = 'none';
        document.getElementById('loginPage').style.display = 'flex';
        document.getElementById('passwordInput').value = '';
      }, 1500);
    } else {
      showToast(result.error || '修改失败', 'error');
    }
  } catch (e) {
    showToast('修改失败：' + e.message, 'error');
  }
}
