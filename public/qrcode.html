<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二维码海报 - 论文收集系统</title>
<link rel="stylesheet" href="css/common.css">
<script src="js/qrcodejs.min.js"></script>
<style>
body { background: #f3f4f6; padding: 20px; }
.container { max-width: 800px; margin: 0 auto; }
h1 { text-align: center; margin-bottom: 24px; color: #1e3a8a; }
.poster-preview {
  background: #fff; border-radius: 16px; padding: 40px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; margin-bottom: 24px;
}
.poster-title { font-size: 28px; font-weight: 700; color: #1e3a8a; margin-bottom: 8px; }
.poster-subtitle { font-size: 14px; color: #6b7280; margin-bottom: 24px; }
.poster-qr { display: inline-block; padding: 16px; background: #fff; border: 2px solid #2563eb; border-radius: 12px; margin: 16px 0; }
.poster-qr canvas { display: block; width: 240px; height: 240px; }
.poster-url { font-family: monospace; font-size: 13px; color: #4b5563; background: #f3f4f6; padding: 8px 12px; border-radius: 6px; display: inline-block; margin-top: 12px; word-break: break-all; }
.poster-footer { margin-top: 24px; font-size: 12px; color: #9ca3af; }
.controls { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 16px; }
.control-row { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.control-label { width: 100px; color: #374151; font-size: 14px; }
.control-row .input { flex: 1; min-width: 200px; }
.action-bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.print-tip { background: #fef3c7; padding: 12px; border-radius: 8px; font-size: 13px; color: #92400e; margin-top: 16px; }
@media print {
  body { background: #fff; padding: 0; }
  .controls, .no-print { display: none !important; }
  .poster-preview { box-shadow: none; }
}
</style>
</head>
<body>

<div class="container">
  <h1>📱 二维码海报</h1>

  <div class="poster-preview" id="poster">
    <div class="poster-title" id="posterTitle">📚 论文提交</div>
    <div class="poster-subtitle" id="posterSubtitle">扫描下方二维码，填写并上传论文</div>
    <div class="poster-qr">
      <div id="qrContainer"></div>
    </div>
    <div class="poster-url" id="urlDisplay"></div>
    <div class="poster-footer">
      数据由教研处统一收集 · 截止时间请关注通知
    </div>
  </div>

  <div class="controls no-print">
    <h3 class="mb-3">🎨 自定义海报</h3>
    <div class="control-row">
      <div class="control-label">主标题</div>
      <input type="text" class="input" id="titleInput" value="📚 论文提交" oninput="updatePoster()">
    </div>
    <div class="control-row">
      <div class="control-label">副标题</div>
      <input type="text" class="input" id="subtitleInput" value="扫描下方二维码，填写并上传论文" oninput="updatePoster()">
    </div>
    <div class="control-row">
      <div class="control-label">二维码链接</div>
      <input type="text" class="input" id="urlInput" oninput="updateQR()">
      <button class="btn btn-outline btn-sm" onclick="useCurrentURL()">使用当前地址</button>
    </div>
    <div class="control-row">
      <div class="control-label">底部说明</div>
      <input type="text" class="input" id="footerInput" value="数据由教研处统一收集 · 截止时间请关注通知" oninput="updatePoster()">
    </div>
    <div class="action-bar mt-4">
      <button class="btn btn-primary" onclick="downloadQR()">📥 下载二维码图片</button>
      <button class="btn btn-success" onclick="downloadPoster()">📥 下载海报图片</button>
      <button class="btn btn-secondary" onclick="window.print()">🖨️ 打印海报</button>
    </div>
    <div class="print-tip">
      💡 部署到云端后，链接永久不变，二维码只需生成一次！
    </div>
  </div>
</div>

<script>
let baseURL = location.origin + '/submit.html';

function updateQR() {
  const url = document.getElementById('urlInput').value || baseURL;
  document.getElementById('urlDisplay').textContent = url;
  const container = document.getElementById('qrContainer');
  container.innerHTML = '';
  new QRCode(container, {
    text: url,
    width: 240,
    height: 240,
    colorDark: '#1e3a8a',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });
}

function updatePoster() {
  document.getElementById('posterTitle').textContent = document.getElementById('titleInput').value;
  document.getElementById('posterSubtitle').textContent = document.getElementById('subtitleInput').value;
  document.querySelector('.poster-footer').textContent = document.getElementById('footerInput').value;
}

function useCurrentURL() {
  document.getElementById('urlInput').value = baseURL;
  updateQR();
}

function downloadQR() {
  const canvas = document.querySelector('#qrContainer canvas');
  if (!canvas) { alert('二维码尚未生成，请稍候重试'); return; }
  const url = canvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = url;
  a.download = '论文提交二维码.png';
  a.click();
}

function downloadPoster() {
  const script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
  script.onload = () => {
    html2canvas(document.getElementById('poster'), {
      backgroundColor: '#ffffff',
      scale: 2
    }).then(canvas => {
      const url = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url;
      a.download = '论文提交海报.png';
      a.click();
    });
  };
  script.onerror = () => alert('下载海报需要联网加载绘图组件，请检查网络后重试；也可以直接使用「打印海报」功能。');
  document.head.appendChild(script);
}

// 初始化
document.getElementById('urlInput').value = baseURL;
updatePoster();
updateQR();
</script>

</body>
</html>
