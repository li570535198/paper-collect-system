<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学校论文收集系统</title>
<link rel="stylesheet" href="css/common.css">
<style>
body {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.container {
  max-width: 720px;
  width: 100%;
  background: #fff;
  border-radius: 16px;
  padding: 48px 40px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
}
.header { text-align: center; margin-bottom: 36px; }
.icon { font-size: 56px; margin-bottom: 16px; }
h1 { font-size: 28px; color: #1e3a8a; margin-bottom: 8px; }
.subtitle { color: #6b7280; font-size: 14px; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 32px; }
@media (max-width: 600px) { .cards { grid-template-columns: 1fr; } }
.entry-card {
  display: block;
  padding: 24px;
  border: 2px solid #e5e7eb;
  border-radius: 12px;
  text-decoration: none;
  color: #1f2937;
  transition: all 0.2s;
  text-align: center;
}
.entry-card:hover {
  border-color: #2563eb;
  background: #eff6ff;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(37,99,235,0.1);
}
.entry-icon { font-size: 40px; margin-bottom: 12px; }
.entry-title { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
.entry-desc { font-size: 13px; color: #6b7280; }
.status {
  margin-top: 24px;
  padding: 12px 16px;
  background: #f0fdf4;
  border-radius: 8px;
  font-size: 13px;
  color: #166534;
  text-align: center;
}
.status::before { content: '🟢 '; }
.footer {
  margin-top: 32px;
  text-align: center;
  font-size: 12px;
  color: #9ca3af;
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="icon">📚</div>
    <h1>学校论文收集系统</h1>
    <p class="subtitle">云端版 · 老师扫码即可提交 · 数据集中管理</p>
  </div>

  <div class="cards">
    <a href="submit.html" class="entry-card">
      <div class="entry-icon">📝</div>
      <div class="entry-title">教师提交</div>
      <div class="entry-desc">填写论文信息，上传附件</div>
    </a>
    <a href="admin.html" class="entry-card">
      <div class="entry-icon">📊</div>
      <div class="entry-title">管理后台</div>
      <div class="entry-desc">查看统计、审核、导出</div>
    </a>
    <a href="qrcode.html" class="entry-card">
      <div class="entry-icon">📱</div>
      <div class="entry-title">二维码海报</div>
      <div class="entry-desc">下载二维码贴到公告栏</div>
    </a>
  </div>

  <div class="status" id="status">系统运行中</div>

  <div class="footer">
    云端版 · 数据存储在服务器 · 任何设备均可访问
  </div>
</div>

<script src="js/utils.js"></script>
<script>
async function loadStatus() {
  try {
    const s = await API.get('/api/stats');
    document.getElementById('status').textContent =
      `系统运行中 · 已收集 ${s.total} 篇论文 · 今日 ${s.todayCount} 篇`;
  } catch (e) {
    document.getElementById('status').textContent = '系统运行中';
  }
}
loadStatus();
</script>

</body>
</html>
